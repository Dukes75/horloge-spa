<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Horloge Spa</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151c22;color:white;font-family:Arial,sans-serif}
#photo{position:absolute;inset:0;width:100%;height:100%;background-size:cover;background-position:center;transition:opacity 1.5s}
#shade{position:absolute;inset:0;background:rgba(0,0,0,.32)}
#center{position:absolute;top:48%;left:0;width:100%;text-align:center;transform:translateY(-50%);text-shadow:0 3px 18px #222}
#clock{font-size:100px;font-weight:200;letter-spacing:3px}
#date{font-size:25px;margin-top:10px}
#weather{font-size:21px;margin-top:22px}
#footer{position:absolute;bottom:18px;width:100%;text-align:center;font-size:13px;letter-spacing:4px;opacity:.85}
@media(max-width:650px){#clock{font-size:65px}#date{font-size:20px}}
</style>
</head>
<body>
<div id="photo"></div><div id="shade"></div>
<div id="center"><div id="clock">--:--</div><div id="date"></div><div id="weather">Météo en cours...</div></div>
<div id="footer">INSTANT DE SÉRÉNITÉ</div>
<script>
var photos=[
"https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=1200",
"https://images.unsplash.com/photo-1500534623283-312aade485b7?w=1200",
"https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1200",
"https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1200"
];
var n=0;
function changePhoto(){
document.getElementById("photo").style.backgroundImage='url("'+photos[n]+'")';
n=(n+1)%photos.length;
}
function tick(){
var d=new Date();
var h=("0"+d.getHours()).slice(-2);
var m=("0"+d.getMinutes()).slice(-2);
document.getElementById("clock").innerHTML=h+":"+m;
document.getElementById("date").innerHTML=d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
function weather(){
var x=new XMLHttpRequest();
x.open("GET","https://api.open-meteo.com/v1/forecast?latitude=50.54&longitude=2.57&current_weather=true",true);
x.onreadystatechange=function(){
if(x.readyState===4){
if(x.status===200){
try{
var d=JSON.parse(x.responseText);
document.getElementById("weather").innerHTML="Chocques &nbsp; | &nbsp; "+Math.round(d.current_weather.temperature)+"°C";
}catch(e){
document.getElementById("weather").innerHTML="Chocques";
}
}else{
document.getElementById("weather").innerHTML="Chocques";
}
}
};
x.send();
}
changePhoto();
tick();
weather();
setInterval(tick,1000);
setInterval(changePhoto,30000);
setInterval(weather,900000);
</script>
</body>
</html>
