<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="apple-mobile-web-app-title" content="Horloge Spa">

<title>Horloge Spa</title>

<style>

html,body{

  margin:0;

  padding:0;

  width:100%;

  height:100%;

  overflow:hidden;

  background:#151c22;

  color:white;

  font-family:Arial,sans-serif;

}

#photo{

  position:absolute;

  top:0;

  left:0;

  width:100%;

  height:100%;

  background-size:cover;

  background-position:center;

}

#shade{

  position:absolute;

  top:0;

  left:0;

  width:100%;

  height:100%;

  background:rgba(0,0,0,.28);

}

#weather{

  position:absolute;

  top:5%;

  right:4%;

  text-align:right;

  text-shadow:0 2px 12px #222;

}

#weatherMain{

  font-size:28px;

  white-space:nowrap;

}

#weatherDetails{

  font-size:20px;

  margin-top:8px;

}

#center{

  position:absolute;

  top:52%;

  left:5%;

  width:90%;

  text-align:center;

  -webkit-transform:translateY(-50%);

  transform:translateY(-50%);

  text-shadow:0 3px 20px #222;

}

#clock{

  font-size:210px;

  font-weight:200;

  line-height:1;

  letter-spacing:-8px;

  white-space:nowrap;

}

#date{

  font-size:52px;

  margin-top:18px;

  white-space:nowrap;

  display:block;

  text-align:center;

}

/* Adaptation aux petits écrans */

@media(max-width:700px){

  #clock{

    font-size:100px;

    letter-spacing:-4px;

  }

  #date{

    font-size:30px;

  }

  #weatherMain{

    font-size:20px;

  }

  #weatherDetails{

    font-size:16px;

  }

}

</style>

</head>

<body>

<div id="photo"></div>

<div id="shade"></div>

<div id="weather">

  <div id="weatherMain">Chocques | Météo...</div>

  <div id="weatherDetails"></div>

</div>

<div id="center">

  <div id="clock">--:--</div>

  <div id="date"></div>

</div>

<script>

var photos=[

"https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=1600",

"https://images.unsplash.com/photo-1500534623283-312aade485b7?w=1600",

"https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1600",

"https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1600"

];

var n=0;

function changePhoto(){

  document.getElementById("photo").style.backgroundImage=

    'url("'+photos[n]+'")';

  n=(n+1)%photos.length;

}

function fitText(){

  var clock=document.getElementById("clock");

  var date=document.getElementById("date");

  var center=document.getElementById("center");

  // Réinitialisation des tailles

  clock.style.fontSize="210px";

  date.style.fontSize="52px";

  var maxWidth=center.clientWidth*0.94;

  // Ajustement de l'heure

  var size=210;

  while(clock.scrollWidth>maxWidth && size>40){

    size-=2;

    clock.style.fontSize=size+"px";

  }

  // Mesure réelle du texte de l'heure

  var span=document.createElement("span");

  span.style.fontSize=size+"px";

  span.style.fontFamily="Arial";

  span.style.letterSpacing="-8px";

  span.style.whiteSpace="nowrap";

  span.innerHTML=clock.innerHTML;

  document.body.appendChild(span);

  var clockWidth=span.offsetWidth;

  document.body.removeChild(span);

  // Ajustement de la date

  var dateSize=52;

  date.style.fontSize=dateSize+"px";

  while(date.scrollWidth>clockWidth && dateSize>15){

    dateSize-=1;

    date.style.fontSize=dateSize+"px";

  }

}

function tick(){

  var d=new Date();

  var h=("0"+d.getHours()).slice(-2);

  var m=("0"+d.getMinutes()).slice(-2);

  document.getElementById("clock").textContent=h+":"+m;

  document.getElementById("date").textContent=

    d.toLocaleDateString("fr-FR",{

      weekday:"long",

      day:"numeric",

      month:"long"

    });

  fitText();

}

function weatherIcon(code){

  if(code===0)return "☀️";

  if(code<=3)return "🌤️";

  if(code===45||code===48)return "🌫️";

  if(code>=51&&code<=67)return "🌧️";

  if(code>=71&&code<=77)return "❄️";

  if(code>=80&&code<=82)return "🌦️";

  if(code>=95)return "⛈️";

  return "☁️";

}

function weather(){

  var x=new XMLHttpRequest();

  var url=

    "https://api.open-meteo.com/v1/forecast"+

    "?latitude=50.54"+

    "&longitude=2.57"+

    "&current=temperature_2m,weather_code"+

    "&daily=temperature_2m_max,temperature_2m_min"+

    "&timezone=Europe%2FParis";

  x.open("GET",url,true);

  x.onreadystatechange=function(){

    if(x.readyState===4&&x.status===200){

      try{

        var d=JSON.parse(x.responseText);

        var temp=Math.round(d.current.temperature_2m);

        var max=Math.round(d.daily.temperature_2m_max[0]);

        var min=Math.round(d.daily.temperature_2m_min[0]);

        var icon=weatherIcon(d.current.weather_code);

        document.getElementById("weatherMain").textContent=

          "Chocques | "+icon+" "+temp+"°C";

        document.getElementById("weatherDetails").textContent=

          "Max "+max+"°C  •  Min "+min+"°C";

      }catch(e){}

    }

  };

  x.send();

}

changePhoto();

tick();

weather();

setInterval(tick,1000);

setInterval(changePhoto,240000);

setInterval(weather,900000);

window.onresize=fitText;

</script>

</body>

</html>
